name: release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  phar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          tools: composer
      - run: composer install --no-interaction --no-progress
      - env:
          TAG: ${{ inputs.tag }}
        run: php coolhop app:build coolhop.phar --build-version="${TAG#v}" --no-interaction
      - working-directory: builds
        run: sha256sum coolhop.phar > coolhop.phar.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" builds/coolhop.phar builds/coolhop.phar.sha256 --clobber
