name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  test:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: coolify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COOLHOP_TEST_DB_URL: pgsql:host=127.0.0.1;port=5432;dbname=coolify;user=postgres;password=x
      COOLHOP_TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: php coolhop app:build coolhop.phar --build-version=0.0.0-ci --no-interaction
      - run: php builds/coolhop.phar --version

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh bin/acceptance bin/dump-schema

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint -color
